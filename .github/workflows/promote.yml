name: Promote

on:
  workflow_dispatch:
    inputs:
      canary:
        description: 'Tested canary tag (vX.Y.Z-canary-<7-char-sha>)'
        required: true
        type: string
  # These events run the offline integrity proof only. They cannot promote.
  push:
    branches: [codex/channels]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  integrity-proof:
    # Light: cargo metadata + unittest, no build.
    runs-on: ubuntu-latest
    environment: public-ci
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m unittest -v scripts.test_channels.Promotion scripts.test_channels.Publication
      # crates.io names are permanent. Only `zega` may ever be published; every
      # other workspace crate says `publish = false`, and this fails if one stops.
      - name: Only the zega crate is publishable
        run: |
          cargo metadata --format-version 1 --no-deps | python3 -c '
          import json, sys
          publishable = sorted(p["name"] for p in json.load(sys.stdin)["packages"] if p.get("publish") != [])
          assert publishable == ["zega"], f"publishable crates must be exactly [zega], got {publishable}"
          print("publishable: zega")'

  promote:
    if: always() && needs.integrity-proof.result == 'success' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'zegadb/zega'
    needs: integrity-proof
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    concurrency:
      group: zega-channel-writes
      cancel-in-progress: false
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      CANARY: ${{ inputs.canary }}
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/release-credentials
      # No Rust toolchain, cargo, wasm-pack, npm install, or build scripts.
      - name: Verify commit, copy and read back bytes, tag, then advance latest
        run: python3 scripts/channels.py promote "$CANARY" .tmp/promotion

  # npm publication is publish-npm.yml: one fixed workflow file and the `release`
  # environment, for @zegadb/lib and the @zegadb/server-<platform> packages.

  crates:
    # Stable only: a crates.io version can never be replaced, so canaries never go there.
    if: always() && needs.promote.result == 'success'
    needs: promote
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      CANARY: ${{ inputs.canary }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.canary }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Require the crates.io token
        env:
          CARGO_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: |
          if [ -z "$CARGO_TOKEN" ]; then
            echo '::error::Needs Sami: CARGO_TOKEN on zegadb/zega/release'; exit 1
          fi
      - name: The crate version is the promoted version
        run: |
          STABLE="${CANARY%%-canary-*}"; STABLE="${STABLE#v}"
          CRATE=$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "zega"))')
          if [ "$CRATE" != "$STABLE" ]; then
            echo "::error::zega crate is $CRATE but the promotion is $STABLE"; exit 1
          fi
          echo "VERSION=$STABLE" >> "$GITHUB_ENV"
      # zega has no dependencies and the promoted commit already built on every
      # platform as a canary, so there is nothing for a verify build to prove.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: cargo publish -p zega --locked --no-verify
      - name: Read it back from crates.io
        run: |
          for attempt in $(seq 1 20); do
            if curl -sfL -A "zega-release-verify (github.com/zegadb/zega)" \
                "https://crates.io/api/v1/crates/zega/$VERSION/download" -o readback.crate; then
              tar tzf readback.crate | grep -qx "zega-$VERSION/Cargo.toml" && { echo "zega $VERSION is on crates.io"; exit 0; }
            fi
            sleep 15
          done
          echo "::error::zega $VERSION did not appear on crates.io"; exit 1

  # Stable only, like crates: addiscorp/zega:<version> and :latest, built from
  # the promoted commit (docker/zega/Dockerfile), for linux/amd64 and
  # linux/arm64 (Apple Silicon Macs run arm64 images; Intel Macs and most
  # Linux run amd64). pg_zega and Simien's local stack pin these tags.
  # Each architecture builds natively and is pushed by digest; docker-merge
  # joins them under the tags; docker-readback pulls the tag on both
  # architectures and runs it.
  docker-build:
    name: docker build (${{ matrix.platform }})
    if: always() && needs.promote.result == 'success'
    needs: promote
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      contents: read
    env:
      CANARY: ${{ inputs.canary }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.canary }}
          persist-credentials: false
      - name: Require the Docker Hub account and token
        env:
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKER_TOKEN" ]; then
            echo '::error::Needs Sami: DOCKER_TOKEN and DOCKERHUB_USERNAME on zegadb/zega/release'; exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/zega/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ vars.DOCKERHUB_USERNAME }}/zega,push-by-digest=true,name-canonical=true,push=true
      - name: Record the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: zega-digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}
          retention-days: 1

  docker-merge:
    name: docker tags (both architectures)
    needs: docker-build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      CANARY: ${{ inputs.canary }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
    outputs:
      version: ${{ steps.tags.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zega-digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Tag both digests as one image
        id: tags
        run: |
          set -euo pipefail
          STABLE="${CANARY%%-canary-*}"; VERSION="${STABLE#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          image="$DOCKERHUB_USERNAME/zega"
          docker buildx imagetools create \
            -t "$image:$VERSION" -t "$image:latest" \
            "$image@$(cat digests/amd64)" "$image@$(cat digests/arm64)"
      # The tag must hold exactly the two digests just built.
      - name: The tag lists both architectures
        env:
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          set -euo pipefail
          image="$DOCKERHUB_USERNAME/zega:$VERSION"
          docker buildx imagetools inspect "$image" --raw > index.json
          python3 - index.json digests/amd64 digests/arm64 <<'PY'
          import json, sys
          index = json.load(open(sys.argv[1]))
          served = {f'{m["platform"]["os"]}/{m["platform"]["architecture"]}': m["digest"]
                    for m in index["manifests"] if m["platform"]["os"] != "unknown"}
          want = {"linux/amd64": open(sys.argv[2]).read().strip(), "linux/arm64": open(sys.argv[3]).read().strip()}
          assert served == want, f"tag serves {served}, expected {want}"
          print("tag serves", served)
          PY

  docker-readback:
    name: docker read-back (${{ matrix.platform }})
    needs: docker-merge
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      VERSION: ${{ needs.docker-merge.outputs.version }}
    steps:
      # Pulled by tag from Docker Hub, as Simien's local stack pulls it.
      - name: Pull the tag and run it
        run: |
          image="$DOCKERHUB_USERNAME/zega:$VERSION"
          docker pull "$image"
          test "$(docker image inspect "$image" --format '{{.Os}}/{{.Architecture}}')" = "${{ matrix.platform }}"
          docker run -d --name zega-readback -e ZEGA_TOKEN=readback-token -p 9342:9342 "$image"
          for _ in $(seq 1 30); do
            if curl -fsS -H "Authorization: Bearer readback-token" http://127.0.0.1:9342/health; then
              echo; echo "$image serves on ${{ matrix.platform }}"; exit 0
            fi
            sleep 2
          done
          docker logs zega-readback; exit 1
