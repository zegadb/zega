name: Tests
on:
  # A branch is checked once, by its pull request; pushes run only on main.
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    # The repository is private: the org's own runners, selected as in zegadb/cloud and zegadb/dashboard.
    runs-on: [self-hosted, web]
    timeout-minutes: 15
    env:
      TMPDIR: ${{ github.workspace }}/.tmp
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # The version package.json pins (packageManager and engines).
          bun-version: '1.3.14'
      - run: mkdir -p "$TMPDIR" && chmod 700 "$TMPDIR"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # The committed types are what the committed OpenAPI document generates.
      - run: bun run api:types
      - run: git diff --exit-code -- src/types/cloud-api.d.ts
      - run: bun test --timeout 600000
      # All four executables compile (Bun cross-compiles from any host).
      - run: bun run build
