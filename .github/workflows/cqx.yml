name: cqx

# What this repository scores, and which way it is moving.
#
# On a pull request it scores the branch, scores the commit the branch is
# based on, and says what moved. A score on its own says little — every
# project sits somewhere. The direction is the part worth looking at.
#
# Reporting only, to begin with: a gate that fails people before anybody has
# agreed what the number should be teaches them to turn it off. Set
# `fail: true` once the numbers settle.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # So each finding lands on its own line in Files changed, rather than in a
  # comment that grows on every push.
  security-events: write

jobs:
  score:
    name: score
    # Light: a checkout and a scan, no compilation.
    runs-on: ubuntu-latest
    environment: public-ci
    steps:
      # Deep enough to reach the base of the pull request without a second
      # fetch: that is what turns a score into a direction.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: samifouad/cqx-action@v1
        id: cqx
        with:
          fail: 'false'

      - name: What it said
        run: |
          echo "scores: ${{ steps.cqx.outputs.scores }}"
          echo "read it: ${{ steps.cqx.outputs.url }}"
