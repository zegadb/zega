name: CLI
# The zega CLI (cli/, TypeScript on Bun), moved from zegadb/cli on 31 Oct. Its
# executables are built for releases by release.yml; this checks the source.
on:
  # A branch is checked once, by its pull request; pushes run only on main.
  push:
    branches: [main]
    paths: ['cli/**', '.github/workflows/cli.yml']
  pull_request:
    paths: ['cli/**', '.github/workflows/cli.yml']
permissions:
  contents: read
concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: cli
jobs:
  tests:
    # Temporary (addiscorp/infra#34): [simien] no longer hosts mirab VMs. Back to
    # a fresh mirab VM, mirab-linux-x64 (APS 11), once x86 mirab VMs have capacity.
    runs-on: host-linux-x64
    timeout-minutes: 15
    env:
      TMPDIR: ${{ github.workspace }}/cli/.tmp
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # The version cli/package.json pins (packageManager and engines).
          bun-version: '1.3.14'
      - run: mkdir -p "$TMPDIR" && chmod 700 "$TMPDIR"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # The committed types are what the committed OpenAPI document generates.
      - run: bun run api:types
      - run: git diff --exit-code -- src/types/cloud-api.d.ts
      - run: bun test --timeout 600000
      # All the executables compile (Bun cross-compiles from any host).
      - run: bun run build

  package-proof:
    if: github.event_name == 'pull_request'
    runs-on: host-linux-x64 # temporary (Sami, 31 Oct), until mirab VMs have Node + Bun images
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: mkdir -p .tmp && chmod 700 .tmp
      - run: node scripts/npm-pack-proof.mjs
