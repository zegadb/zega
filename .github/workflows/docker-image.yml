name: Docker images

# Build-only smoke check for both images, whenever their Dockerfiles or the
# crates they package change. Never pushes: there is no registry credential
# in this job.
# - zega-g: the Fly Machines image Zega Cloud runs (registry.fly.io/zega-g,
#   docs/cloud-image.md); pushing it is a manual step Ava runs.
# - zega: the plain server image (docker/zega). promote.yml publishes it as
#   addiscorp/zega:<version> when a stable version is promoted.

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - '.dockerignore'
      - 'zega/**'
      - 'zega-server/**'
      - 'zega-cli/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/docker-image.yml'
  pull_request:
    paths:
      - 'docker/**'
      - '.dockerignore'
      - 'zega/**'
      - 'zega-server/**'
      - 'zega-cli/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/docker-image.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: public-ci
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/zega-g/Dockerfile
          platforms: linux/amd64
          push: false
          tags: zega-g:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The plain server image promote.yml publishes as addiscorp/zega.
      - name: Build the plain server image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/zega/Dockerfile
          platforms: linux/amd64
          push: false
          tags: zega:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
