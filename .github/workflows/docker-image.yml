name: Docker images

# Build-only smoke check for both images, whenever their Dockerfiles or the
# crates they package change. Never pushes: there is no registry credential
# in this job.
# - zega-g: the Fly Machines image Zega Cloud runs (registry.fly.io/zega-g,
#   docs/cloud-image.md); pushing it is a manual step Ava runs.
# - zega: the plain server image (docker/zega). promote.yml publishes it as
#   addiscorp/zega:<version> when a stable version is promoted.

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - '.dockerignore'
      - 'zega/**'
      - 'zega-server/**'
      - 'zega-cli/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/docker-image.yml'
  pull_request:
    paths:
      - 'docker/**'
      - '.dockerignore'
      - 'zega/**'
      - 'zega-server/**'
      - 'zega-cli/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/docker-image.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  zega-g:
    name: zega-g image (linux/amd64, Fly)
    runs-on: ubuntu-24.04 # public repo: GitHub-hosted (addiscorp/infra#34)
    environment: public-ci
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/zega-g/Dockerfile
          platforms: linux/amd64
          push: false
          tags: zega-g:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The plain server image promote.yml publishes as addiscorp/zega, on both
  # architectures Docker users have: amd64 (Linux, Intel Macs) and arm64
  # (Apple Silicon, ARM Linux). Each builds natively on its own runner (an
  # emulated Rust build would take hours), and each must start and answer.
  zega:
    name: zega image (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub-hosted: this repo is public and self-hosted runners refuse
          # public repos (addiscorp/infra#34). arm64 builds natively on ARM.
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    environment: public-ci
    env:
      IMAGE: zega-ci:${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
      CONTAINER: zega-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build the plain server image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/zega/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=zega-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=zega-${{ matrix.platform }}
      - name: It starts and answers on ${{ matrix.platform }}
        run: |
          test "$(docker image inspect "$IMAGE" --format '{{.Os}}/{{.Architecture}}')" = "${{ matrix.platform }}"
          docker run -d --name "$CONTAINER" -e ZEGA_TOKEN=ci-token -p 127.0.0.1::9342 "$IMAGE"
          port=$(docker port "$CONTAINER" 9342/tcp | head -1 | sed 's/.*://')
          for _ in $(seq 1 90); do
            if curl -fsS -H "Authorization: Bearer ci-token" "http://127.0.0.1:$port/health"; then
              echo; echo "$IMAGE (${{ matrix.platform }}) serves"; exit 0
            fi
            sleep 2
          done
          docker logs "$CONTAINER"; exit 1
      - name: Remove this job's container and image
        if: always()
        run: |
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          docker image rm "$IMAGE" >/dev/null 2>&1 || true
