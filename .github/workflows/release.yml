name: Release (canary)

# Push-to-main is deliberately not a trigger here: tag-canary.yml tags every
# main commit right after it lands, and that tag push already runs this
# workflow with the full matrix. Adding push:branches:[main] as well would
# build the same commit twice.
on:
  workflow_dispatch: {}
  push:
    tags: ['v*-canary-*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  resolve:
    # Light: ref/version bookkeeping, no compilation.
    runs-on: ubuntu-latest
    environment: public-ci
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
      npm_version: ${{ steps.ref.outputs.npm_version }}
      full_matrix: ${{ steps.scope.outputs.full_matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Validate release ref; branches only exercise builds
        id: ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = tag ] || [ "$EVENT_NAME" = workflow_dispatch ]; then
            python3 scripts/channels.py resolve "$GITHUB_REF_NAME"
          fi
      # A PR only ever proves the branch builds (see above); a tag push or a
      # manual dispatch is the real release path and always gets every
      # platform plus the packaging job.
      - name: Decide whether this run owes the full native matrix
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            echo "full_matrix=false" >> "$GITHUB_OUTPUT"
          else
            echo "full_matrix=true" >> "$GITHUB_OUTPUT"
          fi

  # Which PR changes touch platform-sensitive code, i.e. code where
  # linux-only CI has previously shipped a Windows/macOS-only bug:
  #   - zega/src/wal/**, zega/src/checkpoint.rs, zega/src/journal.rs:
  #     durability/WAL rollback (3033c47 "Fix durable storage replacement and
  #     WAL rollback on Windows").
  #   - zega/src/lib.rs, zega/src/graph_file/**, zega-server/src/handlers.rs,
  #     zega-cli/src/main.rs: the disk-import path (0bb1ad0 "Fix disk imports
  #     on Windows: no directory handle, close before cleanup").
  #   - zega-bench/src/mem.rs: process/RSS reporting (e235ae0 "zega-mem: no
  #     spawning, RSS only on unix").
  #   - .gitattributes: line-ending handling that broke a vendored binary on
  #     Windows checkout (4f38288 "Preserve vendored wasm package bytes on
  #     Windows").
  #   - Cargo.toml/Cargo.lock, .github/workflows/release.yml,
  #     .github/actions/**: dependency and CI-definition changes can move
  #     every platform at once and get no other signal.
  changes:
    if: github.event_name == 'pull_request'
    # Light: a file-list diff, no checkout, no compilation.
    runs-on: ubuntu-latest
    environment: public-ci
    # dorny/paths-filter fetches the PR's changed files from the REST API on
    # a pull_request event (no checkout needed), which needs this scope.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      platform: ${{ steps.filter.outputs.platform }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'scripts/**'
              - 'npm/**'
              - 'browser/**'
              - '.github/workflows/release.yml'
              - '.github/actions/**'
            platform:
              - 'zega/src/wal/**'
              - 'zega/src/graph_file/**'
              - 'zega/src/lib.rs'
              - 'zega/src/checkpoint.rs'
              - 'zega/src/journal.rs'
              - 'zega-server/src/handlers.rs'
              - 'zega-cli/src/main.rs'
              - 'zega-bench/src/mem.rs'
              - '.gitattributes'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/release.yml'
              - '.github/actions/**'

  # Job-level `if:` cannot see the matrix context (only steps and
  # `runs-on`/`container`/`services` can), so which native legs run is
  # decided here, as a job output, rather than inside `native`'s own `if:`.
  plan:
    needs: [resolve, changes]
    # `changes` only runs for pull_request (see its own `if:`); a skipped
    # need otherwise cascades into skipping this job too, which would silence
    # the native matrix on every tag push and dispatch. `always()` plus an
    # explicit check on `resolve` keeps this running whenever resolve itself
    # didn't fail.
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-latest
    environment: public-ci
    outputs:
      run_native: ${{ steps.plan.outputs.run_native }}
      native_matrix: ${{ steps.plan.outputs.native_matrix }}
    steps:
      - id: plan
        env:
          FULL_MATRIX: ${{ needs.resolve.outputs.full_matrix }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          PLATFORM_CHANGED: ${{ needs.changes.outputs.platform }}
        run: |
          set -euo pipefail
          full='[
            {"platform":"linux-x64","runner":"ubuntu-latest","sccache_bucket":"zega-sccache-linux-x64","extension":""},
            {"platform":"darwin-arm64","runner":"macos-15","sccache_bucket":"zega-sccache-darwin-arm64","extension":""},
            {"platform":"darwin-x64","runner":"macos-15-intel","sccache_bucket":"zega-sccache-darwin-x64","extension":""},
            {"platform":"windows-x64","runner":"windows-latest","sccache_bucket":"zega-sccache-windows-x64","extension":".exe"}
          ]'
          linux_only='[
            {"platform":"linux-x64","runner":"ubuntu-latest","sccache_bucket":"zega-sccache-linux-x64","extension":""}
          ]'
          if [ "$FULL_MATRIX" = true ]; then
            run_native=true; matrix="$full"
          elif [ "$CODE_CHANGED" = true ] && [ "$PLATFORM_CHANGED" = true ]; then
            run_native=true; matrix="$full"
          elif [ "$CODE_CHANGED" = true ]; then
            run_native=true; matrix="$linux_only"
          else
            run_native=false; matrix='[]'
          fi
          echo "run_native=$run_native" >> "$GITHUB_OUTPUT"
          echo "native_matrix=$(echo "$matrix" | jq -c '{include:.}')" >> "$GITHUB_OUTPUT"

  package:
    needs: resolve
    # Packaging only proves anything new on the branch that ships: main (via
    # its canary tag) and manual dispatches. Every PR that reaches main
    # crosses this job on the tag push right after merge, so skipping it on
    # the PR itself does not skip the check, only when it runs.
    if: needs.resolve.outputs.full_matrix == 'true'
    runs-on: ${{ matrix.runner }}
    environment: public-ci
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            sccache_bucket: zega-sccache-linux-x64
    env:
      RUSTC_WRAPPER: sccache
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      SCCACHE_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      SCCACHE_REGION: auto
      SCCACHE_BUCKET: ${{ matrix.sccache_bucket }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      CARGO_TARGET_DIR: ${{ github.workspace }}/.target
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tmp/playwright
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/npm-package
        with:
          npm-version: ${{ needs.resolve.outputs.npm_version }}
      - name: Assemble the tested package and its WASM files
        run: |
          mkdir -p artifacts/npm-package
          cp -r dist/wasm artifacts/npm-package/wasm
          node --input-type=module -e 'import fs from "node:fs"; const pack = JSON.parse(fs.readFileSync("artifacts/pack.json")); fs.copyFileSync("artifacts/" + pack.filename, "artifacts/npm-package/package.tgz");'
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: artifacts/npm-package/
          if-no-files-found: error

  # Deliberately does not `need` `changes` directly: that job is skipped
  # outside pull_request, and an unqualified `if:` here would let a skipped
  # need cascade into skipping this job too (see `plan`, which already
  # guards against exactly that and is the only thing `native` reads).
  native:
    needs: [resolve, plan]
    # On a PR: linux-x64 always (it is the cheap, always-on correctness
    # gate); macOS/Windows only when the diff touches platform-sensitive
    # paths (see the `changes` job) or nothing code-shaped changed at all
    # skips even linux-x64 (docs/markdown-only PRs). On a tag push or manual
    # dispatch: every platform, unconditionally. See the `plan` job: which
    # legs run is a job output, since matrix isn't visible from a job `if:`.
    if: needs.plan.outputs.run_native == 'true'
    runs-on: ${{ matrix.runner }}
    environment: public-ci
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.native_matrix) }}
    env:
      RUSTC_WRAPPER: sccache
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      SCCACHE_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      SCCACHE_REGION: auto
      SCCACHE_BUCKET: ${{ matrix.sccache_bucket }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      CARGO_TARGET_DIR: ${{ github.workspace }}/.target
      PLATFORM: ${{ matrix.platform }}
      EXTENSION: ${{ matrix.extension }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.96.0'
          components: clippy
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: ./.github/actions/rust-cache
      - name: Check and lint the workspace
        if: needs.resolve.outputs.tag == ''
        run: |
          cargo check --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets --all-features
          cargo test --locked --workspace
      - uses: actions/setup-node@v4
        if: needs.resolve.outputs.tag == '' && matrix.platform == 'linux-x64'
        with:
          node-version: '24'
      - name: Test the embedded explorer against its native database
        if: needs.resolve.outputs.tag == '' && matrix.platform == 'linux-x64'
        run: |
          cargo build --locked -p zega-cli
          cd browser
          npm ci
          npx playwright install --with-deps chromium
          npm run test:cli
      - name: Build CLI with embedded explorer
        run: cargo build --locked --release -p zega-cli
      - name: Check canonical ZQL/JSON files and embedded samples
        run: |
          # Only files git tracks: build output and test reports (Playwright's
          # test-results/, node_modules/, .target/) are not canonical sources.
          git ls-files -z -- '*.zql' '*.json' | xargs -0 ".target/release/zega${EXTENSION}" fmt --check
          python scripts/fmt-samples.py ".target/release/zega${EXTENSION}" --check --extract .tmp/samples
      - uses: actions/checkout@v5
        if: needs.resolve.outputs.tag == '' && matrix.platform == 'linux-x64'
        with:
          repository: zegadb/testsuite
          ref: 206aec6c2dd9cbbc3552e4cfbf78b7b45043b96a
          path: .tmp/testsuite
          persist-credentials: false
      - name: Prove formatter AST equality and idempotence across the corpus and samples
        if: needs.resolve.outputs.tag == '' && matrix.platform == 'linux-x64'
        run: |
          cp -R .tmp/testsuite/tests .tmp/corpus
          cargo test --locked -p zega --lib fmt:: -- --ignored --nocapture
      - name: Smoke test the built CLI
        run: python scripts/smoke-cli.py ".target/release/zega${EXTENSION}"
      - name: Prepare native artifact
        run: |
          mkdir -p artifacts/native
          artifact_name=$(python scripts/channels.py artifact-name "$PLATFORM")
          cp ".target/release/zega${EXTENSION}" "artifacts/native/${artifact_name}"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: artifacts/native/
          if-no-files-found: error

  # A single, stable name for branch protection to require, regardless of
  # which native legs actually ran for a given PR. Runs unconditionally
  # (needs' own skips would otherwise cascade and skip this too) and fails
  # only on a real failure upstream, never on a leg that was correctly
  # skipped by path filtering.
  release-required:
    name: Release required checks
    if: always()
    needs: [resolve, changes, plan, package, native]
    runs-on: ubuntu-latest
    environment: public-ci
    steps:
      - name: No upstream failures
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 -c "
          import json, os, sys
          needs = json.loads(os.environ['NEEDS_JSON'])
          bad = {k: v['result'] for k, v in needs.items() if v['result'] not in ('success', 'skipped')}
          if bad:
              print('failed upstream jobs:', bad)
              sys.exit(1)
          print('ok:', {k: v['result'] for k, v in needs.items()})
          "

  publish:
    if: needs.resolve.outputs.tag != '' && github.repository == 'zegadb/zega'
    needs: [resolve, package, native]
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: zega-channel-writes
      cancel-in-progress: false
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      CANARY: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: ./.github/actions/release-credentials
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble checksummed canary
        run: python3 scripts/channels.py prepare "$CANARY" artifacts .tmp/release
      - name: Upload, verify readback, advance canary only
        run: python3 scripts/channels.py publish-r2 "$CANARY" .tmp/release

  npm:
    # Sami configures trust, then Ava removes this literal hard stop in a PR.
    if: ${{ false }}
    needs: publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global npm@11.16.0 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: artifact
      - run: npm publish artifact/package.tgz --tag canary --access public --provenance --ignore-scripts --registry=https://registry.npmjs.org/
