name: Release (canary)

# Push-to-main is deliberately not a trigger here: tag-canary.yml tags every
# main commit right after it lands, and that tag push already runs this
# workflow with the full matrix. Adding push:branches:[main] as well would
# build the same commit twice.
on:
  workflow_dispatch: {}
  push:
    tags: ['v*-canary-*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  resolve:
    # Light: ref/version bookkeeping, no compilation.
    runs-on: ubuntu-24.04 # public repo: GitHub-hosted (addiscorp/infra#34)
    environment: public-ci
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
      npm_version: ${{ steps.ref.outputs.npm_version }}
      full_matrix: ${{ steps.scope.outputs.full_matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Validate release ref; branches only exercise builds
        id: ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = tag ] || [ "$EVENT_NAME" = workflow_dispatch ]; then
            python3 scripts/channels.py resolve "$GITHUB_REF_NAME"
          fi
      # A PR only ever proves the branch builds (see above); a tag push or a
      # manual dispatch is the real release path and always gets every
      # platform plus the packaging job.
      - name: Decide whether this run owes the full native matrix
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            echo "full_matrix=false" >> "$GITHUB_OUTPUT"
          else
            echo "full_matrix=true" >> "$GITHUB_OUTPUT"
          fi

  # Which PR changes touch platform-sensitive code, i.e. code where
  # linux-only CI has previously shipped a Windows/macOS-only bug:
  #   - zega/src/wal/**, zega/src/checkpoint.rs, zega/src/journal.rs:
  #     durability/WAL rollback (3033c47 "Fix durable storage replacement and
  #     WAL rollback on Windows").
  #   - zega/src/lib.rs, zega/src/graph_file/**, zega-server/src/handlers.rs,
  #     zega-cli/src/main.rs: the disk-import path (0bb1ad0 "Fix disk imports
  #     on Windows: no directory handle, close before cleanup").
  #   - zega-bench/src/mem.rs: process/RSS reporting (e235ae0 "zega-mem: no
  #     spawning, RSS only on unix").
  #   - .gitattributes: line-ending handling that broke a vendored binary on
  #     Windows checkout (4f38288 "Preserve vendored wasm package bytes on
  #     Windows").
  #   - Cargo.toml/Cargo.lock, .github/workflows/release.yml,
  #     .github/actions/**: dependency and CI-definition changes can move
  #     every platform at once and get no other signal.
  changes:
    if: github.event_name == 'pull_request'
    # Light: a file-list diff, no checkout, no compilation.
    runs-on: ubuntu-24.04 # public repo: GitHub-hosted (addiscorp/infra#34)
    environment: public-ci
    # dorny/paths-filter fetches the PR's changed files from the REST API on
    # a pull_request event (no checkout needed), which needs this scope.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      platform: ${{ steps.filter.outputs.platform }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'scripts/**'
              - 'npm/**'
              - 'browser/**'
              - '.github/workflows/release.yml'
              - '.github/actions/**'
            platform:
              - 'zega/src/wal/**'
              - 'zega/src/graph_file/**'
              - 'zega/src/lib.rs'
              - 'zega/src/checkpoint.rs'
              - 'zega/src/journal.rs'
              - 'zega-server/src/handlers.rs'
              - 'zega-cli/src/main.rs'
              - 'zega-bench/src/mem.rs'
              - '.gitattributes'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/release.yml'
              - '.github/actions/**'

  # Job-level `if:` cannot see the matrix context (only steps and
  # `runs-on`/`container`/`services` can), so which native legs run is
  # decided here, as a job output, rather than inside `native`'s own `if:`.
  plan:
    needs: [resolve, changes]
    # `changes` only runs for pull_request (see its own `if:`); a skipped
    # need otherwise cascades into skipping this job too, which would silence
    # the native matrix on every tag push and dispatch. `always()` plus an
    # explicit check on `resolve` keeps this running whenever resolve itself
    # didn't fail.
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-24.04 # public repo: GitHub-hosted (addiscorp/infra#34)
    environment: public-ci
    outputs:
      run_native: ${{ steps.plan.outputs.run_native }}
      native_matrix: ${{ steps.plan.outputs.native_matrix }}
    steps:
      - id: plan
        env:
          FULL_MATRIX: ${{ needs.resolve.outputs.full_matrix }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          PLATFORM_CHANGED: ${{ needs.changes.outputs.platform }}
        run: |
          set -euo pipefail
          # GitHub-hosted: this repo is public and self-hosted runners refuse
          # public repos (a fork PR must never run on our machines); hosted
          # runners are free for public repos (addiscorp/infra#34).
          full='[
            {"platform":"linux-x64","runner":"ubuntu-24.04","sccache_bucket":"zega-sccache-linux-x64","extension":""},
            {"platform":"darwin-arm64","runner":"macos-15","sccache_bucket":"zega-sccache-darwin-arm64","extension":""},
            {"platform":"darwin-x64","runner":"macos-15-intel","sccache_bucket":"zega-sccache-darwin-x64","extension":""}
          ]'
          # A PR's linux leg is the shipping linux-x64 leg; its binary is never
          # uploaded (a PR doesn't ship). Shipping builds (tags, dispatch) use `full`.
          linux_only='[
            {"platform":"linux-x64","runner":"ubuntu-24.04","sccache_bucket":"zega-sccache-linux-x64","extension":""}
          ]'
          if [ "$FULL_MATRIX" = true ]; then
            run_native=true; matrix="$full"
          elif [ "$CODE_CHANGED" = true ] && [ "$PLATFORM_CHANGED" = true ]; then
            run_native=true; matrix="$full"
          elif [ "$CODE_CHANGED" = true ]; then
            run_native=true; matrix="$linux_only"
          else
            run_native=false; matrix='[]'
          fi
          echo "run_native=$run_native" >> "$GITHUB_OUTPUT"
          echo "native_matrix=$(echo "$matrix" | jq -c '{include:.}')" >> "$GITHUB_OUTPUT"

  package:
    needs: resolve
    # Packaging only proves anything new on the branch that ships: main (via
    # its canary tag) and manual dispatches. Every PR that reaches main
    # crosses this job on the tag push right after merge, so skipping it on
    # the PR itself does not skip the check, only when it runs.
    if: always() && needs.resolve.result == 'success' && needs.resolve.outputs.full_matrix == 'true'
    runs-on: ${{ matrix.runner }}
    environment: public-ci
    outputs:
      sha: ${{ steps.handoff.outputs.sha }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04 # GitHub-hosted, as in plan's matrix
            sccache_bucket: zega-sccache-linux-x64
    env:
      RUSTC_WRAPPER: sccache
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      SCCACHE_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      SCCACHE_REGION: auto
      SCCACHE_BUCKET: ${{ matrix.sccache_bucket }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      CARGO_TARGET_DIR: ${{ github.workspace }}/.target
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tmp/playwright
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/npm-package
        with:
          npm-version: ${{ needs.resolve.outputs.npm_version }}
      - name: Assemble the tested package and its WASM files
        run: |
          mkdir -p artifacts/npm-package
          cp -r dist/wasm artifacts/npm-package/wasm
          node --input-type=module -e 'import fs from "node:fs"; const pack = JSON.parse(fs.readFileSync("artifacts/pack.json")); fs.copyFileSync("artifacts/" + pack.filename, "artifacts/npm-package/package.tgz");'
      # Handed to publish through R2, never GitHub artifacts (Sami, 31 Oct): a
      # tag run's files under ci/<run id>/ in zega-ci (kept 7 days), and their
      # sha256 as job outputs, which publish checks every byte against.
      - name: Hand the package on
        id: handoff
        if: needs.resolve.outputs.tag != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CI_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CI_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          mkdir -p .tmp
          tar -C artifacts -cf .tmp/npm-package.tar npm-package
          aws s3 cp .tmp/npm-package.tar "s3://zega-ci/ci/${GITHUB_RUN_ID}/npm-package.tar" --endpoint-url "$SCCACHE_ENDPOINT" --only-show-errors
          echo "sha=$(python3 -c 'import hashlib, sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' .tmp/npm-package.tar)" >> "$GITHUB_OUTPUT"

  # Cheap PR guard for the installed package's client declaration contract.
  # The full package job still exercises the packed tarball and WASM consumers
  # on release refs; this runs the exact client declarations without building
  # WASM, installing browsers, or using R2 credentials.
  package-types:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04 # public repo: GitHub-hosted (addiscorp/infra#34)
    environment: public-ci
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked package tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check client declarations for Node and browser consumers
        run: npm run check:client-types

  # Deliberately does not `need` `changes` directly: that job is skipped
  # outside pull_request, and an unqualified `if:` here would let a skipped
  # need cascade into skipping this job too (see `plan`, which already
  # guards against exactly that and is the only thing `native` reads).
  native:
    needs: [resolve, plan]
    # On a PR: linux-x64 always (it is the cheap, always-on correctness
    # gate); macOS/Windows only when the diff touches platform-sensitive
    # paths (see the `changes` job) or nothing code-shaped changed at all
    # skips even linux-x64 (docs/markdown-only PRs). On a tag push or manual
    # dispatch: every platform, unconditionally. See the `plan` job: which
    # legs run is a job output, since matrix isn't visible from a job `if:`.
    if: always() && needs.resolve.result == 'success' && needs.plan.result == 'success' && needs.plan.outputs.run_native == 'true'
    runs-on: ${{ matrix.runner }}
    environment: public-ci
    # One output per platform: each leg sets only its own, so all of them
    # reach publish (a shared name would keep only the last leg's).
    outputs:
      sha_linux_x64: ${{ steps.handoff.outputs.sha_linux_x64 }}
      sha_darwin_arm64: ${{ steps.handoff.outputs.sha_darwin_arm64 }}
      sha_darwin_x64: ${{ steps.handoff.outputs.sha_darwin_x64 }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.native_matrix) }}
    env:
      RUSTC_WRAPPER: sccache
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      SCCACHE_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      SCCACHE_REGION: auto
      SCCACHE_BUCKET: ${{ matrix.sccache_bucket }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      CARGO_TARGET_DIR: ${{ github.workspace }}/.target
      PLATFORM: ${{ matrix.platform }}
      EXTENSION: ${{ matrix.extension }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.96.0'
          components: clippy
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: ./.github/actions/rust-cache
      - name: Check and lint the workspace
        if: needs.resolve.outputs.tag == ''
        run: |
          cargo check --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets --all-features
          # APS 54: Storage::Sqlite is off by default, so its tests (and the
          # file-vs-SQLite comparisons in zega/tests/storage.rs) only build
          # with the feature. It only adds code (nothing is gated on it being
          # off), so one run with it covers both; a second run without it
          # repeated every zega test (~17 minutes).
          # linked_proof's two timing proofs (a latency ratio and a push deadline)
          # run nightly on their own (proofs.yml): on shared runners they
          # failed on load alone, blocking unrelated PRs.
          cargo test --locked --workspace --features zega/sqlite -- \
            --skip g_ten_thousand_leases_do_not_slow_source_writes \
            --skip b_update_arrives_by_push_within_six_seconds
      # The browser build (zega-wasm, vendored in browser/pkg) compiles the
      # engine for wasm32, where native-only code must be gated out.
      - name: Check the engine for wasm
        if: needs.resolve.outputs.tag == '' && matrix.platform == 'linux-x64'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --locked --manifest-path zega-wasm/Cargo.toml --target wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        if: needs.resolve.outputs.tag == '' && matrix.platform == 'linux-x64'
        with:
          node-version: '24'
      - name: Test the embedded explorer against its native database
        if: needs.resolve.outputs.tag == '' && matrix.platform == 'linux-x64'
        run: |
          cargo build --locked -p zega-cli
          cd browser
          npm ci
          npx playwright install --with-deps chromium
          npm run test:cli
      - name: Test the npm client against the real zega-server
        if: needs.resolve.outputs.tag == '' && matrix.platform == 'linux-x64'
        # npm/check-client.mjs needs only Node: the client has no dependencies, and
        # --server makes a missing or unstartable binary a failure, not a skip.
        run: node npm/check-client.mjs --server .target/debug/zega-server
      - name: Build CLI with embedded explorer
        run: cargo build --locked --release -p zega-cli
      - name: Check canonical ZQL/JSON files and embedded samples
        run: |
          # Only files git tracks: build output and test reports (Playwright's
          # test-results/, node_modules/, .target/) are not canonical sources,
          # and neither is the CLI's own JSON (cli/: package.json, its OpenAPI
          # document, test fixtures).
          git ls-files -z -- '*.zql' '*.json' ':!cli/**' | xargs -0 ".target/release/zega-server${EXTENSION}" fmt --check
          python3 scripts/fmt-samples.py ".target/release/zega-server${EXTENSION}" --check --extract .tmp/samples
      - uses: actions/checkout@v5
        if: needs.resolve.outputs.tag == '' && matrix.platform == 'linux-x64'
        with:
          repository: zegadb/testsuite
          ref: 206aec6c2dd9cbbc3552e4cfbf78b7b45043b96a
          path: .tmp/testsuite
          # testsuite is private: a read-only deploy key on it, kept in public-ci.
          ssh-key: ${{ secrets.TESTSUITE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Prove formatter AST equality and idempotence across the corpus and samples
        if: needs.resolve.outputs.tag == '' && matrix.platform == 'linux-x64'
        run: |
          cp -R .tmp/testsuite/tests .tmp/corpus
          cargo test --locked -p zega --lib fmt:: -- --ignored --nocapture
      - name: Smoke test the built CLI
        run: python3 scripts/smoke-cli.py ".target/release/zega-server${EXTENSION}"
      # Only a canary publishes the binaries, so only a tag run hands them on,
      # through R2 as the package job does. An arm64 PR leg tests only; its
      # binary isn't the linux-x64 artifact.
      - name: Hand the binary on
        id: handoff
        if: needs.resolve.outputs.tag != '' && runner.arch != 'ARM64'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CI_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CI_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          name=$(python3 scripts/channels.py artifact-name "$PLATFORM")
          binary=".target/release/zega-server${EXTENSION}"
          aws s3 cp "$binary" "s3://zega-ci/ci/${GITHUB_RUN_ID}/native-${PLATFORM}/${name}" --endpoint-url "$SCCACHE_ENDPOINT" --only-show-errors
          echo "sha_${PLATFORM//-/_}=$(python3 -c 'import hashlib, sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "$binary")" >> "$GITHUB_OUTPUT"

  # A single, stable name for branch protection to require, regardless of
  # which native legs actually ran for a given PR. Runs unconditionally
  # (needs' own skips would otherwise cascade and skip this too). PR path
  # filtering may skip native; release refs must run native and publish.
  release-required:
    name: Release required checks
    if: always()
    needs: [resolve, changes, plan, package, package-types, native, publish]
    runs-on: ubuntu-24.04 # public repo: GitHub-hosted (addiscorp/infra#34)
    environment: public-ci
    steps:
      # The check is a script in the repo, so this job needs the checkout too.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: No upstream failures
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          FULL_MATRIX: ${{ needs.resolve.outputs.full_matrix }}
        run: python3 scripts/check-release-needs.py

  publish:
    if: always() && needs.resolve.result == 'success' && needs.package.result == 'success' && needs.native.result == 'success' && needs.resolve.outputs.tag != '' && github.repository == 'zegadb/zega'
    needs: [resolve, package, native]
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: zega-channel-writes
      cancel-in-progress: false
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      CANARY: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: ./.github/actions/release-credentials
      - name: Fetch what the build jobs handed on, checked against their hashes
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CI_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CI_SECRET_ACCESS_KEY }}
          NATIVE_SHAS: ${{ toJson(needs.native.outputs) }}
          PACKAGE_SHA: ${{ needs.package.outputs.sha }}
        run: |
          set -euo pipefail
          base="s3://zega-ci/ci/${GITHUB_RUN_ID}"
          fetch() { # key, local path, expected sha256 (a missing hash fails here)
            [[ "$3" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no sha256 handed on for $1"; exit 1; }
            mkdir -p "$(dirname "$2")"
            aws s3 cp "$base/$1" "$2" --endpoint-url "$R2_ENDPOINT" --only-show-errors
            echo "$3  $2" | sha256sum -c -
          }
          for platform in $(python3 -c 'import sys; sys.path.insert(0, "scripts"); import channels; print(" ".join(channels.NATIVE_PLATFORMS))'); do
            name=$(python3 scripts/channels.py artifact-name "$platform")
            sha=$(jq -r --arg k "sha_${platform//-/_}" '.[$k] // ""' <<<"$NATIVE_SHAS")
            fetch "native-$platform/$name" "artifacts/native-$platform/$name" "$sha"
          done
          fetch npm-package.tar .tmp/npm-package.tar "$PACKAGE_SHA"
          tar -C artifacts -xf .tmp/npm-package.tar
      - name: Assemble checksummed canary
        run: python3 scripts/channels.py prepare "$CANARY" artifacts .tmp/release
      - name: Upload, verify readback, advance canary only
        run: python3 scripts/channels.py publish-r2 "$CANARY" .tmp/release

  # npm publication is publish-npm.yml: one fixed workflow file and the `release`
  # environment, for @zegadb/lib and the @zegadb/server-<platform> packages.
