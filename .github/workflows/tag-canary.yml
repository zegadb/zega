name: Tag canary

on:
  push:
    branches: [main, codex/channels]
  pull_request:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC, 03:00 in Alberta (APS 9: canaries are nightly)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  guards:
    name: Prove promoted-version and duplicate-tag refusals
    # Light: unittest + cargo metadata, no build.
    # Temporary (addiscorp/infra#34): [simien] no longer hosts mirab VMs. Back to
    # a fresh mirab VM, mirab-linux-x64 (APS 11), once x86 mirab VMs have capacity.
    runs-on: host-linux-x64
    environment: public-ci
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # The NixOS host runners have python3 3.13 and setup-python has no NixOS
      # builds; it only runs where python3 is missing or too old for tomllib.
      - id: python
        run: python3 -c 'import tomllib' 2>/dev/null && echo "ready=true" >> "$GITHUB_OUTPUT" || echo "ready=false" >> "$GITHUB_OUTPUT"
      - if: steps.python.outputs.ready != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m unittest -v scripts.test_channels.TagGuards
      - run: python3 -m unittest -v scripts.test_channels.Release

  tag-canary:
    # APS 9: canaries are nightly (or by hand), not one per push.
    if: always() && needs.guards.result == 'success' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.repository == 'zegadb/zega'
    needs: guards
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      actions: write
    concurrency:
      group: zega-tag-canary-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Compute, guard, push and dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: python3 scripts/channels.py tag-canary
