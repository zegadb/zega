self-hosted-runner:
  # Our release runners (addiscorp/infra#34): the ci-release runner group,
  # which admits this public repo. Only release jobs (canary tags, dispatches,
  # promotions) use them; pull requests run on GitHub-hosted runners.
  labels:
    - host-linux-x64
    - host-macos-arm64
    - host-macos-x64
