self-hosted-runner:
  # Our CI runners: a fresh mirab VM per job (addiscorp/aps APS 11).
  # host-* runners are temporary host-level runners (addiscorp/infra#34) until
  # mirab VMs cover these jobs.
  labels:
    - mirab-linux-arm64
    - mirab-linux-x64
    - host-linux-x64
    - host-linux-x64-quiet
    - host-macos-arm64
    - host-macos-x64
