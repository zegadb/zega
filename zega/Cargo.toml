[package]
name = "zega"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "zega, a graph database built for speed. The engine is developed at github.com/zegadb/zega and will be published under this name."
homepage = "https://zega.dev"
readme = "README.md"
keywords = ["graph", "database", "query", "zql"]
categories = ["database-implementations"]

[features]
default = ["http"]
http = ["dep:ureq"]

[dependencies]
csv = "1.3"
url = "2.5"
regex = "1"
bincode = { workspace = true }
crc32fast = { workspace = true }
# Software sin/cos/asin: the A* heuristic is bit-identical on native and wasm.
libm = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
# `.graph` content digest and imported-file names (docs/graph-format.md).
sha2 = { workspace = true }
thiserror = { workspace = true }
# `…Like` text matching (zegadb/zega#98): NFD decomposition to drop combining
# marks before case-folding. Pure Rust, no_std-friendly, wasm32-safe.
unicode-normalization = "0.1"
# HashTable for the unique indexes (zegadb/zega#100): a table of bare node
# ids, hashed by the value each id's node stores, is 9 bytes per entry where
# a map from value hash to ids is 33. No default features: no hasher, no
# allocator API.
hashbrown = { version = "0.17", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "~3.4.2", optional = true, default-features = false, features = ["rustls"] }
# `.zga` bundles (APS 34, docs/files.md): blake3 content-addressing, and the
# deterministic `.zgz` tar.gz. flate2 is already in the dependency tree
# (zega-server); tar is the small maintained tar reader/writer — there is no
# tar crate already in the tree to reuse.
blake3 = "1"
tar = "0.4"
flate2 = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
serde_json = { workspace = true }
