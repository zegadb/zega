[package]
name = "zega-bench-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Spike: zega server for the Cloudflare Containers benchmark, with measurement routes."

[[bin]]
name = "zega-bench-server"
path = "src/main.rs"

[dependencies]
axum = "0.7"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "signal"] }
zega = { workspace = true }
zega-server = { path = "../../../zega-server" }
