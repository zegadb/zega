[package]
publish = false
name = "zega-bench"
version.workspace = true
edition = "2021"

[dependencies]
zega = { path = "../zega" }
neo4rs = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }

# getrusage for peak RSS; there is no Windows equivalent wired, so zega-mem
# reports RSS as n/a there.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "zega-bench"
path = "src/main.rs"

# Bytes per node and per relationship, with query timings (zegadb/zega#100).
# A separate binary because it installs a counting global allocator.
[[bin]]
name = "zega-mem"
path = "src/mem.rs"

# The travel-graph scale bench (zegadb/zega#143): dataset generator and the
# native server path. A separate binary for its own counting allocator.
[[bin]]
name = "zega-scale"
path = "src/scale.rs"
