[package]
name = "zega-wasm"
version = "0.2.5"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/zegadb/zega"

# Standalone workspace: excluded from the root workspace so the wasm build
# never tries to compile the server crates for wasm32.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
serde_json = "1.0"
wasm-bindgen = "0.2"
zega = { path = "../zega", default-features = false }
